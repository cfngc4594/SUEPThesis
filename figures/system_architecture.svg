<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <style>
      .layer {
        stroke: #333333;
        stroke-width: 1.4;
      }
      .node {
        fill: #ffffff;
        stroke: #333333;
        stroke-width: 1.25;
      }
      .layer-title-gutter {
        font-family: "Songti SC","STSong","SimSun","Times New Roman",serif;
        font-size: 24px;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .layer-title-center {
        font-family: "Songti SC","STSong","SimSun","Times New Roman",serif;
        font-size: 28px;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .node-text {
        font-family: "Songti SC","STSong","SimSun","Times New Roman",serif;
        font-size: 25px;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .node-text-small {
        font-family: "Songti SC","STSong","SimSun","Times New Roman",serif;
        font-size: 22px;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .small-text {
        font-family: "Songti SC","STSong","SimSun","Times New Roman",serif;
        font-size: 18px;
        fill: #333333;
        text-anchor: middle;
      }
      .line {
        fill: none;
        stroke: #666666;
        stroke-width: 2.3;
        marker-end: url(#arrow);
      }
      .dashed {
        fill: none;
        stroke: #666666;
        stroke-width: 2.1;
        stroke-dasharray: 8 7;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="820" fill="#ffffff"/>

  <!-- Layer backgrounds -->
  <rect class="layer" x="40" y="20" width="1400" height="130" rx="16" fill="#eef0ff"/>
  <rect class="layer" x="40" y="190" width="1400" height="130" rx="16" fill="#eef9fb"/>
  <rect class="layer" x="40" y="370" width="920" height="170" rx="16" fill="#fff3e8"/>
  <rect class="layer" x="1000" y="370" width="440" height="190" rx="16" fill="#e8fae6"/>
  <rect class="layer" x="40" y="600" width="1400" height="170" rx="16" fill="#f4f4f4"/>

  <!-- Layer titles -->
  <text class="layer-title-gutter" x="120" y="85">表现层</text>
  <text class="layer-title-gutter" x="120" y="255">业务服务层</text>
  <text class="layer-title-gutter" x="110" y="455">评测执行层</text>
  <text class="layer-title-center" x="1220" y="406">AI 辅助层</text>
  <text class="layer-title-gutter" x="135" y="685">数据层</text>

  <!-- Presentation nodes -->
  <rect class="node" x="200" y="50" width="320" height="70" rx="10"/>
  <rect class="node" x="590" y="43" width="320" height="84" rx="10"/>
  <rect class="node" x="980" y="43" width="360" height="84" rx="10"/>

  <text class="node-text" x="360">
    <tspan x="360" y="85">题目集与题目详情</tspan>
  </text>
  <text class="node-text" x="750">
    <tspan x="750" y="70">代码编辑器与</tspan>
    <tspan x="750" y="100">统一工作区</tspan>
  </text>
  <text class="node-text" x="1160">
    <tspan x="1160" y="70">提交记录、结果详情</tspan>
    <tspan x="1160" y="100">与 AI 反馈面板</tspan>
  </text>

  <!-- Service nodes -->
  <rect class="node" x="200" y="216" width="340" height="78" rx="10"/>
  <rect class="node" x="585" y="216" width="340" height="78" rx="10"/>
  <rect class="node" x="970" y="216" width="360" height="78" rx="10"/>

  <text class="node-text" x="370">
    <tspan x="370" y="241">Next.js 页面路由</tspan>
    <tspan x="370" y="269">与 Server Actions</tspan>
  </text>
  <text class="node-text" x="755">
    <tspan x="755" y="241">认证鉴权、题目读取</tspan>
    <tspan x="755" y="269">与模板加载服务</tspan>
  </text>
  <text class="node-text" x="1150">
    <tspan x="1150" y="241">提交受理、状态回写</tspan>
    <tspan x="1150" y="269">与结果聚合服务</tspan>
  </text>

  <!-- Judge nodes -->
  <rect class="node" x="180" y="405" width="230" height="100" rx="10"/>
  <rect class="node" x="445" y="405" width="230" height="100" rx="10"/>
  <rect class="node" x="710" y="405" width="230" height="100" rx="10"/>

  <text class="node-text" x="295">
    <tspan x="295" y="440">Submission 创建</tspan>
    <tspan x="295" y="470">与任务初始化</tspan>
  </text>
  <text class="node-text" x="560">
    <tspan x="560" y="440">编译命令生成</tspan>
    <tspan x="560" y="470">与日志截断</tspan>
  </text>
  <text class="node-text" x="825">
    <tspan x="825" y="440">Docker 容器执行</tspan>
    <tspan x="825" y="470">与用例判定</tspan>
  </text>

  <!-- AI node -->
  <rect class="node" x="1050" y="434" width="340" height="106" rx="10"/>
  <text class="node-text" x="1220">
    <tspan x="1220" y="457">异步分析任务、</tspan>
    <tspan x="1220" y="487">DeepSeek 调用</tspan>
    <tspan x="1220" y="517">与结构化反馈生成</tspan>
  </text>

  <!-- Data nodes -->
  <rect class="node" x="230" y="630" width="460" height="110" rx="10"/>
  <rect class="node" x="830" y="630" width="500" height="110" rx="10"/>

  <text class="node-text-small" x="460">
    <tspan x="460" y="657">Prisma 数据访问层</tspan>
    <tspan x="460" y="685">User / Problem / Submission /</tspan>
    <tspan x="460" y="713">Testcase / CodeAnalysis</tspan>
  </text>
  <text class="node-text-small" x="1080">
    <tspan x="1080" y="657">PostgreSQL 持久化存储</tspan>
    <tspan x="1080" y="685">及 Docker 本地 / 远程</tspan>
    <tspan x="1080" y="713">运行环境配置</tspan>
  </text>

  <!-- Flows: presentation -> service -->
  <path class="line" d="M360 120 L360 216"/>
  <path class="line" d="M750 127 L750 216"/>
  <path class="line" d="M1160 127 L1160 216"/>

  <!-- Flows: service -> execution / AI -->
  <path class="line" d="M370 294 L370 380 L295 380 L295 405"/>
  <path class="line" d="M755 294 L755 380 L560 380 L560 405"/>
  <path class="line" d="M1150 294 L1150 380 L825 380 L825 405"/>
  <path class="line" d="M1160 294 L1160 430"/>

  <!-- Flows: execution / AI -> data -->
  <path class="line" d="M295 505 L295 585 L360 585 L360 630"/>
  <path class="line" d="M560 505 L560 585 L560 630"/>
  <path class="line" d="M825 505 L825 585 L980 585 L980 630"/>
  <path class="line" d="M1220 540 L1220 630"/>

  <!-- Judge to AI trigger -->
  <path class="dashed" d="M940 470 L1050 470"/>
</svg>
